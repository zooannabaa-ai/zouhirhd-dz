<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المنتج</title><style>body{margin:0;background:#0b1220;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:30px 18px}.card{background:#121c2e;border:1px solid #26364f;border-radius:20px;padding:25px;text-align:center}.logo{max-width:320px;max-height:300px;width:auto;height:auto;object-fit:contain;border-radius:14px;margin:0 auto 20px;display:block}.name{font-size:28px;font-weight:700;margin:10px 0 20px}.prices{display:grid;gap:10px;margin:20px 0}.price{display:flex;justify-content:space-between;gap:15px;background:#0d1728;border-radius:12px;padding:14px 16px}.btn{display:inline-block;border:0;border-radius:12px;padding:14px 22px;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer}.back{background:#26364f;color:#fff}.order{background:#16a34a;color:#fff}.err{padding:30px;color:#fca5a5}.loading{padding:30px;color:#cbd5e1}</style></head><body><main class="wrap"><div class="card" id="app"><div class="loading">جاري تحميل المنتج...</div></div></main><script>(async function(){const app=document.getElementById('app');const key=new URLSearchParams(location.search).get('product');if(!key){app.innerHTML='<div class="err">لم يتم تحديد المنتج.</div>';return}try{const res=await fetch('index.html',{cache:'no-store'});const html=await res.text();const doc=new DOMParser().parseFromString(html,'text/html');const cards=[...doc.querySelectorAll('#productGrid .product.card')];const card=cards.find(c=>(c.getAttribute('data-name')||'').toLowerCase()===key.toLowerCase());if(!card){app.innerHTML='<div class="err">المنتج غير موجود.</div>';return}const name=card.getAttribute('data-name')||card.querySelector('b')?.textContent.trim()||'المنتج';const displayName=card.querySelector('b')?.textContent.trim()||name;const img=card.querySelector('img.product-logo')?.getAttribute('src')||'';const prices=[...card.querySelectorAll('.price')].map(x=>x.textContent.trim()).filter(Boolean);app.innerHTML=`<img class="logo" src="${img}" alt=""><div class="name">${displayName}</div>${prices.length?'<div class="prices">'+prices.map(x=>'<div class="price">'+x+'</div>').join('')+'</div>':''}<div><a class="btn back" href="index.html">العودة للمتجر</a> <a class="btn order" href="index.html?orderProduct="+encodeURIComponent(name)+">اطلب الآن</a></div>`;document.title=displayName}catch(e){app.innerHTML='<div class="err">تعذر تحميل صفحة المنتج.</div>'}})();</script></body></html>
